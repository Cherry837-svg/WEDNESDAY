<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    <title></title>
    <style>
        :root {
            --background-color: #000000;
            --main-color: #7F8C7C;
            --clock-size: 21vmin;
            --date-size: 4.5vmin;
            --seconds-size: 0.75em;
            --date-gap: 5vmin;
            --battery-gap: 4vmin;
            --cell-size: clamp(7px, 2.5vmin, 14px);
            --cell-gap: clamp(5px, 2.0vmin, 14px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--background-color);
            color: var(--main-color);
            font-family: Arial, Helvetica, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #clock-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: max-content;
            max-width: 98vw;
            will-change: transform;
        }

        /* ������ 1 � ���� */
        #date {
            font-size: var(--date-size);
            line-height: 1.2;
            white-space: nowrap;
            text-align: center;
            margin-bottom: var(--date-gap);
            color: var(--main-color);
        }

        /* ������ 2 � ���� */
        #clock {
            display: flex;
            align-items: baseline;
            justify-content: center;
            white-space: nowrap;
            font-size: var(--clock-size);
            line-height: 1;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            color: var(--main-color);
        }

        #hours,
        #minutes {
            display: inline-block;
        }

        #colon {
            display: inline-block;
            width: 0.35em;
            text-align: center;
        }

        #seconds {
            display: inline-block;
            font-size: var(--seconds-size);
            margin-left: 0.08em;
            min-width: 1.35em;
            text-align: left;
        }

        /* �������� ��������� */
        @keyframes colonBlink {

            0%,
            49% {
                opacity: 1;
            }

            50%,
            100% {
                opacity: 0.15;
            }
        }

        /* ������ 3 � ��������� ������� */
        #battery-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            margin-top: var(--battery-gap);
            white-space: nowrap;
            line-height: 1;
            color: var(--main-color);
            font-size: clamp(12px, 3.5vmin, 22px);
        }

        .battery-percent {
            flex: 0 0 auto;
            min-width: 0;
            text-align: center;
            font-size: 1.8em;
            font-variant-numeric: tabular-nums;
        }

        /* ������ ���������� ����� */
        #battery-grid {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--cell-gap);
            flex: 0 0 auto;
        }

        .battery-cell {
            width: var(--cell-size);
            height: var(--cell-size);
            flex: 0 0 var(--cell-size);
            border: 1px solid var(--main-color);
            border-radius: 1px;
            opacity: 0.22;
        }

        .battery-cell.filled {
            opacity: 1;
            background: var(--main-color);
        }

        /* ������� � ��˨��� ����� */
        .status-dot {
            width: clamp(7px, 1.6vmin, 12px);
            height: clamp(7px, 1.6vmin, 12px);
            flex: 0 0 auto;
            border-radius: 50%;
            transition: opacity 0.3s ease;
        }

        #discharging-dot {
            background: #ff3030;
            box-shadow: 0 0 5px #ff3030;
        }

        #charging-dot {
            background: #00ff66;
            box-shadow: 0 0 5px #00ff66;
        }

        .status-dot.inactive {
            opacity: 0.12;
            box-shadow: none;
        }

        .status-dot.active {
            opacity: 1;
        }

        /* �������������� ���������� */
        @media (orientation: landscape) {
            :root {
                --clock-size: 36vmin;
                --date-size: 8vmin;
                --date-gap: 3vmin;
                --battery-gap: 3vmin;
            }
        }

        /* ��������� ������ */
        @media (max-width: 360px) {
            :root {
                --cell-size: 7px;
                --cell-gap: 3px;
            }

            #battery-row {
                gap: 3px;
                font-size: 12px;
            }

            .battery-percent {
                font-size: 1.5em;
            }S
        }
    </style>
</head>

<body>
    <div id="clock-container"> <!-- ������ 1: ���� -->
        <div id="date"></div> <!-- ������ 2: ���� -->
        <div id="clock"> <span id="hours">00</span> <span id="colon">:</span> <span id="minutes">00</span> <span
                id="seconds">:00</span> </div> <!-- ������ 3: ��������� ������� -->
        <div id="battery-row"> <span id="discharging-dot" class="status-dot inactive"></span> <span id="percent-left"
                class="battery-percent">--%</span>
            <div id="battery-grid"> <span class="battery-cell"></span> <span class="battery-cell"></span> <span
                    class="battery-cell"></span> <span class="battery-cell"></span> <span class="battery-cell"></span>
                <span class="battery-cell"></span> <span class="battery-cell"></span> <span class="battery-cell"></span>
                <span class="battery-cell"></span> <span class="battery-cell"></span>
            </div> <span id="percent-right" class="battery-percent">--%</span> <span id="charging-dot"
                class="status-dot inactive"></span>
        </div>
    </div>
    <script> /* ��������� �������� �������� ��� ������ �� ��������� */ const MOVE_AMPLITUDE_X = 20; const MOVE_AMPLITUDE_Y = 20; const MOVE_CYCLE_SECONDS = 30; /* �������� */ const clockContainer = document.getElementById("clock-container"); const hoursElement = document.getElementById("hours"); const minutesElement = document.getElementById("minutes"); const secondsElement = document.getElementById("seconds"); const colonElement = document.getElementById("colon"); const dateElement = document.getElementById("date"); const batteryRow = document.getElementById("battery-row"); const percentLeft = document.getElementById("percent-left"); const percentRight = document.getElementById("percent-right"); const dischargingDot = document.getElementById("discharging-dot"); const chargingDot = document.getElementById("charging-dot"); const batteryCells = document.querySelectorAll(".battery-cell"); let secondsVisible = true; let tapCount = 0; let tapTimer = null; /* ���������� ���� � ������� */ function updateClock() {const now = new Date(); hoursElement.textContent = String(now.getHours()).padStart(2, "0"); minutesElement.textContent = String(now.getMinutes()).padStart(2, "0"); const seconds = String(now.getSeconds()).padStart(2, "0"); if (secondsVisible) {secondsElement.style.display = "inline-block"; secondsElement.textContent = " " + seconds; colonElement.style.animation = "none";} else {secondsElement.style.display = "none"; colonElement.style.animation = "colonBlink 1s steps(2, start) infinite";} const dateOptions = {weekday: "long", day: "2-digit", month: "2-digit", year: "numeric"}; dateElement.textContent = now.toLocaleDateString("de-DE", dateOptions); fitBatteryRow();} /* ������ ���������� �������� ����� ������ ����� */ function fitBatteryRow() {requestAnimationFrame(() => {const clockWidth = document.getElementById("clock").getBoundingClientRect().width; const availableWidth = Math.min(clockWidth, window.innerWidth * 0.98); batteryRow.style.width = availableWidth + "px";});} /* ������� ������� � ������ ����� ������� ������� � ������� ��������/��������� */ document.addEventListener("pointerup", () => {tapCount++; clearTimeout(tapTimer); tapTimer = setTimeout(() => {if (tapCount === 2) {toggleFullscreen();} else if (tapCount >= 3) {secondsVisible = !secondsVisible; updateClock();} tapCount = 0;}, 350);}); function toggleFullscreen() {if (!document.fullscreenElement) {if (document.documentElement.requestFullscreen) {document.documentElement.requestFullscreen().catch(() => { });} } else {if (document.exitFullscreen) {document.exitFullscreen().catch(() => { });} } } /* ������� �������� ����� �� ������ ����̨��� */ const startTime = performance.now(); function moveClock(now) {const cycle = Math.max(1, MOVE_CYCLE_SECONDS) * 1000; const angle = ((now - startTime) % cycle) / cycle * Math.PI * 2; const x = MOVE_AMPLITUDE_X * Math.sin(angle); const y = MOVE_AMPLITUDE_Y * Math.sin(2 * angle); clockContainer.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`; requestAnimationFrame(moveClock);} requestAnimationFrame(moveClock); /* ��������� ������ � ������� */ function updateBattery(level, charging) {const percent = Math.round(level * 100); percentLeft.textContent = percent + "%"; percentRight.textContent = percent + "%"; const filledCount = Math.round(level * batteryCells.length); batteryCells.forEach((cell, index) => {cell.classList.toggle("filled", index < filledCount);}); chargingDot.classList.toggle("active", charging); chargingDot.classList.toggle("inactive", !charging); dischargingDot.classList.toggle("active", !charging); dischargingDot.classList.toggle("inactive", charging);} if ("getBattery" in navigator) {navigator.getBattery().then(battery => {function refreshBattery() {updateBattery(battery.level, battery.charging);} refreshBattery(); battery.addEventListener("levelchange", refreshBattery); battery.addEventListener("chargingchange", refreshBattery);}).catch(() => { });} /* �� ���� ������ �������, ���� ������� ������������ WAKE LOCK */ let wakeLock = null; async function requestWakeLock() {try {if ("wakeLock" in navigator) {wakeLock = await navigator.wakeLock.request("screen");} } catch (error) { } } requestWakeLock(); document.addEventListener("visibilitychange", () => {if (document.visibilityState === "visible") {requestWakeLock();} }); /* ���������� ��� ��������� ������� ������ */ window.addEventListener("resize", fitBatteryRow); window.addEventListener("orientationchange", fitBatteryRow); /* ������ */ updateClock(); setInterval(updateClock, 250); </script>
</body>

</html>
